# 多平台边缘节点优选 —— 一键部署（含 Web 控制台）
#
#   docker compose up -d --build      # 构建并后台运行
#   docker compose logs -f            # 看启动日志（里面有网页地址和访问令牌）
#   docker compose down               # 停止
#
# 打开 http://<服务器IP>:8787/?token=<日志里打印的令牌>
#
# 关键点：
#   * config/ 用 volume 挂载 —— 网页上改的配置与密钥都持久化在这里（建议 chmod 700）
#   * results/ 与 targets/ 也挂载出来，重建镜像不丢数据，改网段不用重新 build
#   * 容器内所有平台合计 TCP 连接速率由 EO_RATE 限制（默认 100/秒，网页上可改）
#   * 真正下发 DNS 需要在网页上把模式设为「执行」并勾选确认（双重保险）
services:
  optimizer:
    build: .
    image: edge-optimizer:latest
    container_name: edge-optimizer
    restart: unless-stopped
    env_file:
      - .env                      # 放密钥/通知 webhook，别提交到仓库
    environment:
      TZ: Asia/Shanghai           # --window 时间窗口与日志时间按此时区
      EO_MODE: web                # web=带管理页面；也可改成 monitor 纯后台跑
      EO_WEB_PORT: "8787"
      # EO_WEB_TOKEN: "自己指定一个长随机串"   # 留空则自动生成并写入 config/config.json
      EO_PLATFORMS: "eo"          # web 模式下仅作为首次默认值
      EO_RATE: "100"              # ★ 全平台合计 TCP 连接上限 100/秒
      EO_INTERVAL: "300"
      EO_WINDOW: ""               # 例如 "00:00-07:00"，留空表示全天
      EO_DNS_SYNC: none           # none | dry-run | push
      EO_CONFIRM_DNS: "no"        # push 时需要 yes（web 模式下以网页勾选为准）
      # EO_WORKERS: "80"
      # EO_TIMEOUT: "3"
      # EO_EXTRA_ARGS: "--ping"   # 可选追加参数
    ports:
      - "8787:8787"               # Web 控制台
    volumes:
      - ./config:/app/config            # 配置与密钥（持久化，权限 600）
      - ./results:/app/results
      - ./targets:/app/targets          # 网段文件；也可只读挂载 :ro
      - ./eo/platforms.py:/app/eo/platforms.py:ro   # 需要改平台定义时用
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
