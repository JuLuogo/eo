name: build-image

# 在 GitHub 上自动构建镜像，推送到 GitHub Container Registry (GHCR)
# 这样服务器上就不用 build 了，直接 docker pull 即可（也更省事，避免本地环境问题）
#
# 触发条件：
#   * push 到 main（改代码即重新构建）
#   * 打 tag（如 v1.0.0，会同时打上该版本标签）
#   * 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 形如 julugo/eo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 GHCR 需要
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置令牌，无需额外配置

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存，后续构建更快
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
            INSTALL_DNS_SDK=1
