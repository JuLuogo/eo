name: build-image

# 在 GitHub 上自动构建镜像，推送到 GitHub Container Registry (GHCR)
# 这样服务器上就不用 build 了，直接 docker pull 即可（也更省事，避免本地环境问题）
#
# 触发条件：
#   * push 到 main（改代码即重新构建）
#   * 打 tag（如 v1.0.0，会同时打上该版本标签）
#   * 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 形如 JuLuogo/eo，镜像名会转小写：juluogo/eo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 上传 Release 资产需要
      packages: write        # 推 GHCR 需要
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置令牌，无需额外配置

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存，后续构建更快
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
            INSTALL_DNS_SDK=1

      # ------------------------------------------------------------------
      # 下面是「离线镜像包」通道。
      #
      # 为什么要它：GHCR 在国内经常拉不动（甚至 token 直接被拒），而 GitHub
      # 的文件下载有大量可用代理（gh-proxy.com / ghfast.top / jsDelivr …）。
      # 所以这里把镜像存成 tar.gz 挂到 Release，服务器下载后 docker load 即可，
      # 完全不依赖任何 registry。镜像里已经是最新代码，与 GHCR 上的完全同源。
      # ------------------------------------------------------------------
      - name: 导出镜像为离线包
        run: |
          set -eux
          SHORT="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          # 用本次构建的 digest 取镜像：按 tag 触发（v1.2.3）时 latest 不会更新，
          # 用 latest 会导出成旧镜像
          IMG="${REGISTRY}/${SHORT}@${{ steps.build.outputs.digest }}"
          echo "IMG=${IMG}"
          docker pull "$IMG"
          docker tag "$IMG" "${REGISTRY}/${SHORT}:latest"
          # 再打一个短名字，load 之后 docker run 更好写
          docker tag "$IMG" edge-optimizer:latest
          docker save "${REGISTRY}/${SHORT}:latest" edge-optimizer:latest \
            | gzip -9 -c > eo-image.tar.gz
          ls -lh eo-image.tar.gz
          sha256sum eo-image.tar.gz

      - name: 上传到 Release（固定标签，每次覆盖）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if ! gh release view image-latest >/dev/null 2>&1; then
            gh release create image-latest \
              --title "预构建镜像（自动更新）" \
              --notes "由 GitHub Actions 在每次推送到 main 时自动更新。下载 eo-image.tar.gz 后：gunzip -c eo-image.tar.gz | docker load"
          fi
          gh release upload image-latest eo-image.tar.gz --clobber
          gh release view image-latest --json assets --jq '.assets[] | "\(.name)  \(.size) 字节"'
